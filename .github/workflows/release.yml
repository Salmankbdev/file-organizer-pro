name: Build Windows Release

# Builds FileOrganizerPro-Setup.exe and FileOrganizerPro-Portable.zip on a
# GitHub-hosted Windows runner (VS 2022 + C++ toolchain is preinstalled) and
# attaches them to a GitHub Release when a version tag is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Or trigger manually from the Actions tab (artifacts are uploaded but no
# Release is created for manual runs).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve version from tag
        shell: pwsh
        # v1.0.0 -> 1.0.0 (used for the installer metadata); manual runs default
        # to 1.0.0. GitHub expressions cannot slice strings, so this is done
        # in a shell step.
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/*') {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $v = '1.0.0'
          }
          Write-Host "Resolved APP_VERSION=$v"
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build release artifacts
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tool/build_release.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/FileOrganizerPro-Setup.exe
            dist/FileOrganizerPro-Portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileOrganizerPro-Setup.exe
            dist/FileOrganizerPro-Portable.zip
          generate_release_notes: true
